<!DOCTYPE html>
<html lang="en" class="h-full w-full overflow-hidden select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Behavior Matrix Points Display (iPad Landscape)</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        digital: ['Orbitron', 'monospace']
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Disable touch callouts, text selection and rubber-banding for native iPad app feel */
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        body {
            background: #0b0d12;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(30, 41, 59, 0.5) 0%, transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(15, 23, 42, 0.8) 0%, transparent 60%);
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
        }

        /* iPad Control Console Plate */
        .console-plate {
            background: linear-gradient(145deg, #1e232d 0%, #12151b 100%);
            box-shadow: 
                inset 0 1px 1px rgba(255, 255, 255, 0.15),
                inset 0 -2px 8px rgba(0, 0, 0, 0.8),
                0 25px 50px -12px rgba(0, 0, 0, 0.85);
            border: 2px solid #2e3545;
        }

        /* LED Indicator Styling */
        .led-indicator {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #1a2e20 0%, #0a140d 70%, #030804 100%);
            border: 2.5px solid #0d120e;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.9), 0 1px 2px rgba(255,255,255,0.08);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .led-indicator.active {
            background: radial-gradient(circle at 35% 35%, #86efac 0%, #22c55e 50%, #15803d 100%);
            border-color: #15803d;
            box-shadow: 
                inset 0 1px 3px rgba(255,255,255,0.8),
                0 0 15px #22c55e,
                0 0 30px rgba(34, 197, 94, 0.7);
        }

        .led-indicator.active::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 6px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            filter: blur(0.5px);
        }

        /* Large iPad Touch Switch Housing */
        .switch-housing {
            background: #0d0f14;
            border-radius: 20px;
            padding: 8px;
            box-shadow: 
                inset 0 4px 10px rgba(0, 0, 0, 0.9),
                0 1px 1px rgba(255, 255, 255, 0.08);
            border: 1px solid #252b38;
        }

        .switch-track {
            position: relative;
            width: 86px;
            height: 175px;
            background: linear-gradient(180deg, #090a0d 0%, #161a22 100%);
            border-radius: 14px;
            cursor: pointer;
            overflow: hidden;
            border: 1px solid #1e2430;
            -webkit-tap-highlight-color: transparent;
        }

        /* Physical Toggle Switch Rocker Handle */
        .switch-handle {
            position: absolute;
            left: 7px;
            width: 70px;
            height: 82px;
            border-radius: 10px;
            background: linear-gradient(180deg, #475569 0%, #1e293b 100%);
            box-shadow: 
                0 8px 16px rgba(0,0,0,0.7),
                inset 0 1px 1px rgba(255,255,255,0.35),
                inset 0 -3px 6px rgba(0,0,0,0.6);
            transition: transform 0.22s cubic-bezier(0.34, 1.4, 0.64, 1);
            transform: translateY(78px); /* Default Down/Off Position */
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #334155;
        }

        /* Grip Texture on Handle */
        .switch-handle::before {
            content: '';
            width: 38px;
            height: 5px;
            background: #0f172a;
            border-radius: 3px;
            box-shadow: 0 1px 0 rgba(255,255,255,0.15), 0 10px 0 #0f172a, 0 -10px 0 #0f172a;
        }

        /* Active UP State */
        .switch-track.on .switch-handle {
            transform: translateY(6px); /* Up/On Position */
            background: linear-gradient(180deg, #334155 0%, #0f172a 100%);
            box-shadow: 
                0 10px 20px rgba(0,0,0,0.8),
                inset 0 1px 2px rgba(255,255,255,0.4),
                0 0 12px rgba(34, 197, 94, 0.25);
            border-color: #475569;
        }

        .switch-track.on .switch-handle::after {
            content: '';
            position: absolute;
            bottom: 8px;
            width: 30px;
            height: 4px;
            background: #22c55e;
            border-radius: 2px;
            box-shadow: 0 0 10px #22c55e;
        }

        /* Digital Readout Screen Enclosure */
        .digital-bezel {
            background: #0e1116;
            border-radius: 28px;
            padding: 24px;
            box-shadow: 
                inset 0 6px 20px rgba(0, 0, 0, 0.95),
                0 2px 4px rgba(255, 255, 255, 0.05);
            border: 2px solid #232a38;
        }

        .digital-screen {
            background: #06080a;
            border-radius: 18px;
            position: relative;
            box-shadow: inset 0 0 30px rgba(0,0,0,1);
            overflow: hidden;
            border: 1.5px solid #161c27;
        }

        /* Glass CRT Scanline & Mesh Texture */
        .digital-screen::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 10;
        }

        .digit-background {
            color: #121c15;
            text-shadow: 0 0 2px rgba(18, 28, 21, 0.5);
        }

        .digit-foreground {
            color: #22c55e;
            text-shadow: 
                0 0 15px rgba(34, 197, 94, 0.8),
                0 0 30px rgba(34, 197, 94, 0.5),
                0 0 45px rgba(34, 197, 94, 0.3);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes digitPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); filter: brightness(1.35); }
            100% { transform: scale(1); }
        }

        .pulse-effect {
            animation: digitPulse 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
    </style>
</head>

<body class="h-full w-full flex items-center justify-center p-4 sm:p-6 lg:p-8">

    <main class="w-full h-full max-w-6xl max-h-[720px] flex flex-col justify-between">
        
        <!-- Top Console Header -->
        <header class="flex justify-between items-center px-4 py-2">
            <div>
                <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-slate-100 via-slate-300 to-slate-400">
                    BEHAVIOR MATRIX CONTROL
                </h1>
                <p class="text-xs font-bold text-slate-400 tracking-widest uppercase mt-0.5">
                    iPad Touch Screen Console
                </p>
            </div>

            <!-- Top Right Reset & Sound Controls -->
            <div class="flex items-center gap-3">
                <button 
                    onclick="toggleSound()" 
                    id="sound-btn"
                    class="h-11 px-4 bg-slate-800/90 hover:bg-slate-700 active:bg-slate-900 text-slate-200 font-bold text-xs tracking-wider rounded-xl border border-slate-700 transition-all flex items-center gap-2 shadow-lg">
                    <span id="sound-icon" class="text-sm">🔊</span>
                    <span>SOUND: <span id="sound-status" class="text-green-400">ON</span></span>
                </button>

                <button 
                    onclick="resetAll()" 
                    class="h-11 px-5 bg-slate-800/90 hover:bg-slate-700 active:bg-slate-900 text-slate-200 font-bold text-xs tracking-wider rounded-xl border border-slate-700 transition-all flex items-center gap-2 shadow-lg active:scale-95">
                    <svg class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    <span>RESET</span>
                </button>
            </div>
        </header>

        <div class="console-plate rounded-3xl p-6 sm:p-8 flex-1 my-2 grid grid-cols-12 gap-6 items-center">
            
            <!-- LEFT HALF: 3 Interactive Switches (7 Columns in iPad Landscape) -->
            <section class="col-span-7 h-full flex items-center justify-center bg-slate-950/50 rounded-2xl border border-slate-800/90 p-4 sm:p-6 shadow-inner">
                <div class="w-full flex justify-around items-end max-w-lg">
                    
                    <!-- SWITCH 0: SAFE -->
                    <div class="flex flex-col items-center gap-3">
                        <!-- LED Indicator -->
                        <div class="flex flex-col items-center gap-1">
                            <span class="text-[10px] font-extrabold text-slate-400 tracking-wider">STATUS</span>
                            <div id="led-0" class="led-indicator" aria-label="Safe status indicator off"></div>
                        </div>

                        <!-- Switch Target (Extra Large Hit Target for iPad Fingers) -->
                        <div class="switch-housing">
                            <button 
                                id="switch-0"
                                onclick="toggleSwitch(0)"
                                class="switch-track focus:outline-none"
                                role="switch"
                                aria-checked="false"
                                aria-label="Toggle Safe">
                                <div class="switch-handle"></div>
                            </button>
                        </div>

                        <!-- Label -->
                        <div class="text-center mt-1">
                            <span class="block text-base sm:text-lg font-black tracking-wider text-slate-100">
                                SAFE
                            </span>
                            <span id="state-0" class="text-xs font-bold text-slate-500 uppercase tracking-widest">OFF</span>
                        </div>
                    </div>

                    <!-- SWITCH 1: RESPONSIBLE -->
                    <div class="flex flex-col items-center gap-3">
                        <!-- LED Indicator -->
                        <div class="flex flex-col items-center gap-1">
                            <span class="text-[10px] font-extrabold text-slate-400 tracking-wider">STATUS</span>
                            <div id="led-1" class="led-indicator" aria-label="Responsible status indicator off"></div>
                        </div>

                        <!-- Switch Target -->
                        <div class="switch-housing">
                            <button 
                                id="switch-1"
                                onclick="toggleSwitch(1)"
                                class="switch-track focus:outline-none"
                                role="switch"
                                aria-checked="false"
                                aria-label="Toggle Responsible">
                                <div class="switch-handle"></div>
                            </button>
                        </div>

                        <!-- Label -->
                        <div class="text-center mt-1">
                            <span class="block text-base sm:text-lg font-black tracking-wider text-slate-100">
                                RESPONSIBLE
                            </span>
                            <span id="state-1" class="text-xs font-bold text-slate-500 uppercase tracking-widest">OFF</span>
                        </div>
                    </div>

                    <!-- SWITCH 2: RESPECTFUL -->
                    <div class="flex flex-col items-center gap-3">
                        <!-- LED Indicator -->
                        <div class="flex flex-col items-center gap-1">
                            <span class="text-[10px] font-extrabold text-slate-400 tracking-wider">STATUS</span>
                            <div id="led-2" class="led-indicator" aria-label="Respectful status indicator off"></div>
                        </div>

                        <!-- Switch Target -->
                        <div class="switch-housing">
                            <button 
                                id="switch-2"
                                onclick="toggleSwitch(2)"
                                class="switch-track focus:outline-none"
                                role="switch"
                                aria-checked="false"
                                aria-label="Toggle Respectful">
                                <div class="switch-handle"></div>
                            </button>
                        </div>

                        <!-- Label -->
                        <div class="text-center mt-1">
                            <span class="block text-base sm:text-lg font-black tracking-wider text-slate-100">
                                RESPECTFUL
                            </span>
                            <span id="state-2" class="text-xs font-bold text-slate-500 uppercase tracking-widest">OFF</span>
                        </div>
                    </div>

                </div>
            </section>

            <!-- RIGHT HALF: Digital Readout Display (5 Columns in iPad Landscape) -->
            <section class="col-span-5 h-full flex flex-col items-center justify-center">
                <div class="w-full max-w-sm digital-bezel">
                    
                    <!-- Screen Header -->
                    <div class="flex justify-between items-center mb-3 px-1">
                        <div class="flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></span>
                            <span class="text-xs font-extrabold tracking-widest text-slate-300 uppercase">POINTS DISPLAY</span>
                        </div>
                        <span class="text-[10px] font-bold text-slate-500 tracking-wider">1-DIGIT READOUT</span>
                    </div>

                    <!-- 7-Segment Screen Display Surface -->
                    <div class="digital-screen py-10 flex items-center justify-center min-h-[220px]">
                        <div class="relative font-digital text-9xl leading-none select-none">
                            <!-- Background Off-segment Ghost "8" -->
                            <span class="digit-background absolute inset-0 text-center">8</span>
                            <!-- Active Live Score Digit -->
                            <span id="score-display" class="digit-foreground relative z-10 block text-center">0</span>
                        </div>
                    </div>

                    <!-- Readout Label -->
                    <div class="mt-4 text-center">
                        <span class="text-xs font-black tracking-widest text-slate-400 uppercase">
                            TOTAL SCORE EARNED
                        </span>
                    </div>
                </div>
            </section>

        </div>

        <!-- Footer Info Bar -->
        <footer class="flex justify-between items-center px-4 py-1 text-xs font-bold text-slate-500">
            <div>
                STATUS: <span class="text-slate-300">READY</span>
            </div>
            <div>
                OPTIMIZED FOR <span class="text-slate-300">IPAD LANDSCAPE</span>
            </div>
        </footer>

    </main>

    <script>
        // Track states of 3 switches [Safe, Responsible, Respectful]
        const switchStates = [false, false, false];
        let soundEnabled = true;
        let audioCtx = null;

        // Initialize Web Audio API on first user touch for iOS/iPadOS Safari restrictions
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Tactile mechanical switch click synthesizer
        function playClickSound(isTurningOn) {
            if (!soundEnabled) return;
            try {
                initAudio();
                if (!audioCtx) return;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = isTurningOn ? 'triangle' : 'sine';
                
                // Frequency sweep for physical click feel
                const startFreq = isTurningOn ? 380 : 220;
                const endFreq = isTurningOn ? 720 : 140;

                osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + 0.04);

                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch (e) {
                // Fails quietly if audio permissions restricted
            }
        }

        // Toggle Switch Logic
        function toggleSwitch(index) {
            initAudio();

            // Toggle state boolean
            switchStates[index] = !switchStates[index];
            const isNowOn = switchStates[index];

            // Trigger mechanical click sound
            playClickSound(isNowOn);

            // DOM elements
            const switchEl = document.getElementById(`switch-${index}`);
            const ledEl = document.getElementById(`led-${index}`);
            const stateTextEl = document.getElementById(`state-${index}`);

            // Update UI elements
            if (isNowOn) {
                switchEl.classList.add('on');
                switchEl.setAttribute('aria-checked', 'true');
                ledEl.classList.add('active');
                ledEl.setAttribute('aria-label', `${getLabelName(index)} indicator on`);
                stateTextEl.textContent = 'ON';
                stateTextEl.className = 'text-xs font-extrabold text-green-400 uppercase tracking-widest';
            } else {
                switchEl.classList.remove('on');
                switchEl.setAttribute('aria-checked', 'false');
                ledEl.classList.remove('active');
                ledEl.setAttribute('aria-label', `${getLabelName(index)} indicator off`);
                stateTextEl.textContent = 'OFF';
                stateTextEl.className = 'text-xs font-bold text-slate-500 uppercase tracking-widest';
            }

            // Update total score
            updateScoreDisplay();
        }

        function getLabelName(index) {
            const labels = ['Safe', 'Responsible', 'Respectful'];
            return labels[index] || '';
        }

        // Calculate and render score
        function updateScoreDisplay() {
            const totalPoints = switchStates.reduce((acc, curr) => acc + (curr ? 1 : 0), 0);
            const scoreDisplay = document.getElementById('score-display');

            if (scoreDisplay.textContent !== totalPoints.toString()) {
                scoreDisplay.textContent = totalPoints;

                // Trigger digit pop pulse animation
                scoreDisplay.classList.remove('pulse-effect');
                void scoreDisplay.offsetWidth; // Force CSS reflow
                scoreDisplay.classList.add('pulse-effect');
            }
        }

        // Reset all switches back to down position
        function resetAll() {
            initAudio();
            switchStates.forEach((state, idx) => {
                if (state) {
                    toggleSwitch(idx);
                }
            });
        }

        // Toggle sound state
        function toggleSound() {
            soundEnabled = !soundEnabled;
            const statusEl = document.getElementById('sound-status');
            const iconEl = document.getElementById('sound-icon');

            if (soundEnabled) {
                statusEl.textContent = 'ON';
                statusEl.className = 'text-green-400';
                iconEl.textContent = '🔊';
            } else {
                statusEl.textContent = 'OFF';
                statusEl.className = 'text-slate-500';
                iconEl.textContent = '🔇';
            }
        }

        // Add keyboard fallback shortcuts for testing (1, 2, 3, R)
        document.addEventListener('keydown', (e) => {
            if (e.key === '1') toggleSwitch(0);
            if (e.key === '2') toggleSwitch(1);
            if (e.key === '3') toggleSwitch(2);
            if (e.key === 'r' || e.key === 'R') resetAll();
        });

        // Ensure audio context unlocks on first iPad screen touch
        document.addEventListener('touchstart', function unlockAudio() {
            initAudio();
            document.removeEventListener('touchstart', unlockAudio);
        }, { once: true });
    </script>
</body>
</html>
