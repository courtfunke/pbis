<!DOCTYPE html>
<html lang="en" class="h-full w-full overflow-hidden select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Class Points</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        digital: ['Orbitron', 'monospace']
                    }
                }
            }
        }
    </script>
    
    <style>
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        body {
            background: #0b0d12;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(30, 41, 59, 0.5) 0%, transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(15, 23, 42, 0.8) 0%, transparent 60%);
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
        }

        /* Console Plate Frame */
        .console-plate {
            background: linear-gradient(145deg, #1e232d 0%, #12151b 100%);
            box-shadow: 
                inset 0 1px 1px rgba(255, 255, 255, 0.15),
                inset 0 -2px 8px rgba(0, 0, 0, 0.8),
                0 25px 50px -12px rgba(0, 0, 0, 0.85);
            border: 2px solid #2e3545;
        }

        /* LED Status Indicator */
        .led-indicator {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #1a2e20 0%, #0a140d 70%, #030804 100%);
            border: 2.5px solid #0d120e;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.9), 0 1px 2px rgba(255,255,255,0.08);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .led-indicator.active {
            background: radial-gradient(circle at 35% 35%, #86efac 0%, #22c55e 50%, #15803d 100%);
            border-color: #15803d;
            box-shadow: 
                inset 0 1px 3px rgba(255,255,255,0.8),
                0 0 15px #22c55e,
                0 0 30px rgba(34, 197, 94, 0.7);
        }

        .led-indicator.active::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 6px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            filter: blur(0.5px);
        }

        /* Vertical Slider Enclosure */
        .slider-housing {
            background: #11151c;
            border-radius: 20px;
            padding: 8px;
            box-shadow: 
                inset 0 4px 10px rgba(0, 0, 0, 0.9),
                0 1px 1px rgba(255, 255, 255, 0.12);
            border: 2px solid #2a3242;
        }

        /* Sunken Vertical Track */
        .slider-track {
            position: relative;
            width: 90px;
            height: 200px;
            background: linear-gradient(180deg, #080a0d 0%, #161b24 100%);
            border-radius: 14px;
            cursor: pointer;
            overflow: hidden;
            border: 2px solid #28303f;
            touch-action: none;
        }

        /* Central Recessed Metal Groove */
        .slider-track::before {
            content: '';
            position: absolute;
            top: 12px;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            background: #06080b;
            border-radius: 5px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.95), 0 1px 0 rgba(255,255,255,0.06);
        }

        /* Top and Bottom Track Markers */
        .slider-track::after {
            content: 'ON • • • • • • • • • OFF';
            position: absolute;
            top: 8px;
            bottom: 8px;
            right: 8px;
            writing-mode: vertical-lr;
            font-size: 8px;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 2px;
            pointer-events: none;
        }

        /* High Visibility Tactile Slider Handle (50% Track Height) */
        .slider-handle {
            position: absolute;
            left: 6px;
            right: 6px;
            height: 92px; /* Exactly 50% of inner track area */
            border-radius: 10px;
            background: linear-gradient(180deg, #94a3b8 0%, #475569 45%, #334155 100%);
            box-shadow: 
                0 8px 16px rgba(0,0,0,0.85),
                inset 0 2px 2px rgba(255,255,255,0.8),
                inset 0 -3px 6px rgba(0,0,0,0.7);
            transform: translateY(96px); /* Rests at BOTTOM (OFF) by default */
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid #cbd5e1;
            z-index: 2;
            transition: transform 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.2), background 0.2s ease, border-color 0.2s ease;
        }

        .slider-handle.dragging {
            transition: none !important; /* Continuous smooth tracking during drag */
        }

        /* Tactile Ridge Texture on Handle */
        .slider-handle-grip {
            width: 44px;
            height: 6px;
            background: #1e293b;
            border-radius: 3px;
            box-shadow: 
                0 1px 0 rgba(255,255,255,0.4), 
                0 12px 0 #1e293b, 
                0 13px 0 rgba(255,255,255,0.4),
                0 -12px 0 #1e293b,
                0 -11px 0 rgba(255,255,255,0.4);
            pointer-events: none;
        }

        /* Handle Status Badge Text */
        .slider-handle-text {
            position: absolute;
            bottom: 6px;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 0.12em;
            color: #1e293b;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.3);
            pointer-events: none;
            transition: color 0.2s ease;
        }

        /* ON State Styling for Handle */
        .slider-track.on .slider-handle {
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 45%, #64748b 100%);
            box-shadow: 
                0 10px 22px rgba(0,0,0,0.9),
                inset 0 2px 3px rgba(255,255,255,1),
                0 0 18px rgba(34, 197, 94, 0.4);
            border-color: #ffffff;
        }

        .slider-track.on .slider-handle-text {
            color: #15803d;
            text-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
        }

        /* Digital Readout Screen Enclosure */
        .digital-bezel {
            background: #0e1116;
            border-radius: 28px;
            padding: 24px;
            box-shadow: 
                inset 0 6px 20px rgba(0, 0, 0, 0.95),
                0 2px 4px rgba(255, 255, 255, 0.05);
            border: 2px solid #232a38;
        }

        .digital-screen {
            background: #06080a;
            border-radius: 18px;
            position: relative;
            box-shadow: inset 0 0 30px rgba(0,0,0,1);
            overflow: hidden;
            border: 1.5px solid #161c27;
        }

        /* Scanline Overlay */
        .digital-screen::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 10;
        }

        .digit-background {
            color: #121c15;
            text-shadow: 0 0 2px rgba(18, 28, 21, 0.5);
        }

        .digit-foreground {
            color: #22c55e;
            text-shadow: 
                0 0 15px rgba(34, 197, 94, 0.8),
                0 0 30px rgba(34, 197, 94, 0.5),
                0 0 45px rgba(34, 197, 94, 0.3);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes digitPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); filter: brightness(1.35); }
            100% { transform: scale(1); }
        }

        .pulse-effect {
            animation: digitPulse 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
    </style>
</head>

<body class="h-full w-full flex items-center justify-center p-4 sm:p-6 lg:p-8">

    <main class="w-full h-full max-w-6xl max-h-[720px] flex flex-col justify-between">
        
        <!-- Top Console Header -->
        <header class="flex justify-between items-center px-4 py-2">
            <div>
                <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-slate-100 via-slate-300 to-slate-400">
                    CLASS POINTS
                </h1>
            </div>

            <!-- Top Right Control Buttons -->
            <div class="flex items-center gap-3">
                <button 
                    onclick="toggleSound()" 
                    id="sound-btn"
                    class="h-11 px-4 bg-slate-800/90 hover:bg-slate-700 active:bg-slate-900 text-slate-200 font-bold text-xs tracking-wider rounded-xl border border-slate-700 transition-all flex items-center gap-2 shadow-lg">
                    <span id="sound-icon" class="text-sm">🔊</span>
                    <span>SOUND: <span id="sound-status" class="text-green-400">ON</span></span>
                </button>

                <button 
                    onclick="resetAll()" 
                    class="h-11 px-5 bg-slate-800/90 hover:bg-slate-700 active:bg-slate-900 text-slate-200 font-bold text-xs tracking-wider rounded-xl border border-slate-700 transition-all flex items-center gap-2 shadow-lg active:scale-95">
                    <svg class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    <span>RESET</span>
                </button>
            </div>
        </header>

        <!-- Main Interactive Console Surface -->
        <div class="console-plate rounded-3xl p-6 sm:p-8 flex-1 my-2 grid grid-cols-12 gap-6 items-center">
            
            <!-- LEFT HALF: 3 Vertical Sliders -->
            <section class="col-span-7 h-full flex items-center justify-center bg-slate-950/50 rounded-2xl border border-slate-800/90 p-4 sm:p-6 shadow-inner">
                <div class="w-full flex justify-around items-end max-w-lg">
                    
                    <!-- SLIDER 0: SAFE -->
                    <div class="flex flex-col items-center gap-3">
                        <div class="flex flex-col items-center gap-1">
                            <span class="text-[10px] font-extrabold text-slate-400 tracking-wider">STATUS</span>
                            <div id="led-0" class="led-indicator" aria-label="Safe status indicator off"></div>
                        </div>

                        <div class="slider-housing">
                            <div 
                                id="slider-track-0"
                                class="slider-track"
                                role="slider"
                                aria-valuemin="0"
                                aria-valuemax="1"
                                aria-valuenow="0"
                                aria-label="Safe Slider">
                                <div id="slider-handle-0" class="slider-handle">
                                    <div class="slider-handle-grip"></div>
                                    <span id="handle-text-0" class="slider-handle-text">OFF</span>
                                </div>
                            </div>
                        </div>

                        <div class="text-center mt-1">
                            <span class="block text-base sm:text-lg font-black tracking-wider text-slate-100">
                                SAFE
                            </span>
                            <span id="state-0" class="text-xs font-bold text-slate-400 uppercase tracking-widest">0 PTS</span>
                        </div>
                    </div>

                    <!-- SLIDER 1: RESPONSIBLE -->
                    <div class="flex flex-col items-center gap-3">
                        <div class="flex flex-col items-center gap-1">
                            <span class="text-[10px] font-extrabold text-slate-400 tracking-wider">STATUS</span>
                            <div id="led-1" class="led-indicator" aria-label="Responsible status indicator off"></div>
                        </div>

                        <div class="slider-housing">
                            <div 
                                id="slider-track-1"
                                class="slider-track"
                                role="slider"
                                aria-valuemin="0"
                                aria-valuemax="1"
                                aria-valuenow="0"
                                aria-label="Responsible Slider">
                                <div id="slider-handle-1" class="slider-handle">
                                    <div class="slider-handle-grip"></div>
                                    <span id="handle-text-1" class="slider-handle-text">OFF</span>
                                </div>
                            </div>
                        </div>

                        <div class="text-center mt-1">
                            <span class="block text-base sm:text-lg font-black tracking-wider text-slate-100">
                                RESPONSIBLE
                            </span>
                            <span id="state-1" class="text-xs font-bold text-slate-400 uppercase tracking-widest">0 PTS</span>
                        </div>
                    </div>

                    <!-- SLIDER 2: RESPECTFUL -->
                    <div class="flex flex-col items-center gap-3">
                        <div class="flex flex-col items-center gap-1">
                            <span class="text-[10px] font-extrabold text-slate-400 tracking-wider">STATUS</span>
                            <div id="led-2" class="led-indicator" aria-label="Respectful status indicator off"></div>
                        </div>

                        <div class="slider-housing">
                            <div 
                                id="slider-track-2"
                                class="slider-track"
                                role="slider"
                                aria-valuemin="0"
                                aria-valuemax="1"
                                aria-valuenow="0"
                                aria-label="Respectful Slider">
                                <div id="slider-handle-2" class="slider-handle">
                                    <div class="slider-handle-grip"></div>
                                    <span id="handle-text-2" class="slider-handle-text">OFF</span>
                                </div>
                            </div>
                        </div>

                        <div class="text-center mt-1">
                            <span class="block text-base sm:text-lg font-black tracking-wider text-slate-100">
                                RESPECTFUL
                            </span>
                            <span id="state-2" class="text-xs font-bold text-slate-400 uppercase tracking-widest">0 PTS</span>
                        </div>
                    </div>

                </div>
            </section>

            <!-- RIGHT HALF: Digital Readout Display -->
            <section class="col-span-5 h-full flex flex-col items-center justify-center">
                <div class="w-full max-w-sm digital-bezel">
                    
                    <div class="flex justify-between items-center mb-3 px-1">
                        <div class="flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></span>
                            <span class="text-xs font-extrabold tracking-widest text-slate-300 uppercase">POINTS DISPLAY</span>
                        </div>
                        <span class="text-[10px] font-bold text-slate-500 tracking-wider">1-DIGIT READOUT</span>
                    </div>

                    <div class="digital-screen py-10 flex items-center justify-center min-h-[220px]">
                        <div class="relative font-digital text-9xl leading-none select-none">
                            <span class="digit-background absolute inset-0 text-center">8</span>
                            <span id="score-display" class="digit-foreground relative z-10 block text-center">0</span>
                        </div>
                    </div>

                    <div class="mt-4 text-center">
                        <span class="text-xs font-black tracking-widest text-slate-400 uppercase">
                            TOTAL SCORE EARNED
                        </span>
                    </div>
                </div>
            </section>

        </div>

        <footer class="flex justify-between items-center px-4 py-1 text-xs font-bold text-slate-500">
            <div>
                CONSOLE: <span class="text-slate-300">ACTIVE</span>
            </div>
            <div>
                FORMATTED FOR <span class="text-slate-300">IPAD LANDSCAPE</span>
            </div>
        </footer>

    </main>

    <script>
        // Track states of 3 sliders [Safe, Responsible, Respectful]
        const sliderStates = [false, false, false];
        let soundEnabled = true;
        let audioCtx = null;

        // Track limits and metrics
        const MIN_Y = 6;   // Top position (ON) in pixels
        const MAX_Y = 96;  // Bottom position (OFF) in pixels

        // Web Audio initialization
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Tactile mechanical slider sound synth
        function playClickSound(isTurningOn) {
            if (!soundEnabled) return;
            try {
                initAudio();
                if (!audioCtx) return;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = isTurningOn ? 'triangle' : 'sine';
                
                const startFreq = isTurningOn ? 340 : 260;
                const endFreq = isTurningOn ? 780 : 120;

                osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + 0.05);

                gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch (e) {
                // Silently handle audio restrictions
            }
        }

        // Apply visual state based on boolean ON/OFF
        function setSliderState(index, isOn, playSound = true) {
            const previousState = sliderStates[index];
            sliderStates[index] = isOn;

            if (playSound && previousState !== isOn) {
                playClickSound(isOn);
            }

            const trackEl = document.getElementById(`slider-track-${index}`);
            const handleEl = document.getElementById(`slider-handle-${index}`);
            const ledEl = document.getElementById(`led-${index}`);
            const handleTextEl = document.getElementById(`handle-text-${index}`);
            const stateTextEl = document.getElementById(`state-${index}`);

            trackEl.setAttribute('aria-valuenow', isOn ? '1' : '0');

            if (isOn) {
                trackEl.classList.add('on');
                handleEl.style.transform = `translateY(${MIN_Y}px)`;
                ledEl.classList.add('active');
                handleTextEl.textContent = 'ON';
                stateTextEl.textContent = '1 PT';
                stateTextEl.className = 'text-xs font-extrabold text-green-400 uppercase tracking-widest';
            } else {
                trackEl.classList.remove('on');
                handleEl.style.transform = `translateY(${MAX_Y}px)`;
                ledEl.classList.remove('active');
                handleTextEl.textContent = 'OFF';
                stateTextEl.textContent = '0 PTS';
                stateTextEl.className = 'text-xs font-bold text-slate-400 uppercase tracking-widest';
            }

            updateScoreDisplay();
        }

        function setupSliderInteractions(index) {
            const trackEl = document.getElementById(`slider-track-${index}`);
            const handleEl = document.getElementById(`slider-handle-${index}`);
            let isDragging = false;
            let startY = 0;
            let initialY = MAX_Y;

            function getClientY(e) {
                return e.touches ? e.touches[0].clientY : e.clientY;
            }

            function onPointerDown(e) {
                initAudio();
                isDragging = true;
                handleEl.classList.add('dragging');
                
                const rect = trackEl.getBoundingClientRect();
                const handleHeight = 92;
                const innerHeight = rect.height - handleHeight;
                
                // Calculate current Y relative to track
                const clickY = getClientY(e) - rect.top - (handleHeight / 2);
                let clampedY = Math.max(MIN_Y, Math.min(MAX_Y, clickY));
                
                startY = getClientY(e);
                initialY = sliderStates[index] ? MIN_Y : MAX_Y;

                // Add document listeners for smooth dragging outside track bounds
                window.addEventListener('pointermove', onPointerMove, { passive: false });
                window.addEventListener('pointerup', onPointerUp);
                window.addEventListener('pointercancel', onPointerUp);
            }

            function onPointerMove(e) {
                if (!isDragging) return;
                e.preventDefault();

                const deltaY = getClientY(e) - startY;
                let newY = initialY + deltaY;
                newY = Math.max(MIN_Y, Math.min(MAX_Y, newY));

                handleEl.style.transform = `translateY(${newY}px)`;

                // Dynamic preview switch threshold at midpoint
                const thresholdY = (MIN_Y + MAX_Y) / 2;
                const previewOn = newY < thresholdY;

                if (previewOn) {
                    trackEl.classList.add('on');
                    document.getElementById(`handle-text-${index}`).textContent = 'ON';
                } else {
                    trackEl.classList.remove('on');
                    document.getElementById(`handle-text-${index}`).textContent = 'OFF';
                }
            }

            function onPointerUp(e) {
                if (!isDragging) return;
                isDragging = false;
                handleEl.classList.remove('dragging');

                window.removeEventListener('pointermove', onPointerMove);
                window.removeEventListener('pointerup', onPointerUp);
                window.removeEventListener('pointercancel', onPointerUp);

                // Determine final state based on handle position or click
                const rect = trackEl.getBoundingClientRect();
                const endY = getClientY(e) - rect.top;
                const trackHeight = rect.height;

                // Toggle if simple tap, or snap to closest end if dragged
                const draggedDistance = Math.abs(getClientY(e) - startY);
                let finalState;

                if (draggedDistance < 6) {
                    // Tap gesture toggles current state
                    finalState = !sliderStates[index];
                } else {
                    // Dragged gesture snaps depending on upper/lower half
                    finalState = endY < (trackHeight / 2);
                }

                setSliderState(index, finalState, true);
            }

            trackEl.addEventListener('pointerdown', onPointerDown);
        }

        // Calculate and render score on digital readout
        function updateScoreDisplay() {
            const totalPoints = sliderStates.reduce((acc, curr) => acc + (curr ? 1 : 0), 0);
            const scoreDisplay = document.getElementById('score-display');

            if (scoreDisplay.textContent !== totalPoints.toString()) {
                scoreDisplay.textContent = totalPoints;

                // Trigger pulse animation
                scoreDisplay.classList.remove('pulse-effect');
                void scoreDisplay.offsetWidth; // Force CSS reflow
                scoreDisplay.classList.add('pulse-effect');
            }
        }

        // Reset all sliders back to bottom OFF position
        function resetAll() {
            initAudio();
            sliderStates.forEach((_, idx) => {
                setSliderState(idx, false, false);
            });
            playClickSound(false);
        }

        // Toggle Sound FX
        function toggleSound() {
            soundEnabled = !soundEnabled;
            const statusEl = document.getElementById('sound-status');
            const iconEl = document.getElementById('sound-icon');

            if (soundEnabled) {
                statusEl.textContent = 'ON';
                statusEl.className = 'text-green-400';
                iconEl.textContent = '🔊';
            } else {
                statusEl.textContent = 'OFF';
                statusEl.className = 'text-slate-500';
                iconEl.textContent = '🔇';
            }
        }

        // Keyboard navigation shortcuts (1, 2, 3, R)
        document.addEventListener('keydown', (e) => {
            if (e.key === '1') setSliderState(0, !sliderStates[0]);
            if (e.key === '2') setSliderState(1, !sliderStates[1]);
            if (e.key === '3') setSliderState(2, !sliderStates[2]);
            if (e.key === 'r' || e.key === 'R') resetAll();
        });

        // Initialize interaction listeners on load
        window.addEventListener('DOMContentLoaded', () => {
            [0, 1, 2].forEach(index => setupSliderInteractions(index));
        });

        // Ensure audio unlocks on iPad touch
        document.addEventListener('touchstart', function unlockAudio() {
            initAudio();
            document.removeEventListener('touchstart', unlockAudio);
        }, { once: true });
    </script>
</body>
</html>
